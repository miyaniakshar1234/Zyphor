name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-release:
    name: Build Release Binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-windows
            artifact_name: zyphor-windows-x86_64.zip
            binary_name: zyphor.exe
          - os: ubuntu-latest
            target: x86_64-linux
            artifact_name: zyphor-linux-x86_64.tar.gz
            binary_name: zyphor
          - os: macos-latest
            target: aarch64-macos
            artifact_name: zyphor-macos-arm64.tar.gz
            binary_name: zyphor

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.0

      - name: Build Optimized Binary
        run: zig build -Doptimize=ReleaseSafe

      - name: Package Artifact (Windows)
        if: runner.os == 'Windows'
        run: |
          Compress-Archive -Path ./zig-out/bin/zyphor.exe, ./README.md, ./LICENSE -DestinationPath ${{ matrix.artifact_name }}

      - name: Package Artifact (Unix)
        if: runner.os != 'Windows'
        run: |
          tar -czvf ${{ matrix.artifact_name }} -C ./zig-out/bin zyphor -C ../.. README.md LICENSE

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
