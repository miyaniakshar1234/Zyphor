name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-linux
            name: zyphor-linux-x86_64
          - os: ubuntu-latest
            target: aarch64-linux
            name: zyphor-linux-aarch64
          - os: macos-latest
            target: x86_64-macos
            name: zyphor-macos-x86_64
          - os: macos-latest
            target: aarch64-macos
            name: zyphor-macos-aarch64
          - os: windows-latest
            target: x86_64-windows
            name: zyphor-windows-x86_64
            ext: .exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0

      - name: Build
        run: zig build -Doptimize=ReleaseFast -Dtarget=${{ matrix.target }}

      - name: Prepare Artifact (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp zig-out/bin/zyphor dist/
          tar -czvf ${{ matrix.name }}.tar.gz -C dist zyphor

      - name: Prepare Artifact (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir dist
          cp zig-out/bin/zyphor.exe dist/
          Compress-Archive -Path dist/zyphor.exe -DestinationPath ${{ matrix.name }}.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            *.tar.gz
            *.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
          generate_release_notes: true
