name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            name: zyphor-linux-x86_64
            archive_cmd: tar -czvf zyphor-linux-x86_64.tar.gz -C dist zyphor
            artifact: zyphor-linux-x86_64.tar.gz
          - os: macos-latest
            name: zyphor-macos-aarch64
            archive_cmd: tar -czvf zyphor-macos-aarch64.tar.gz -C dist zyphor
            artifact: zyphor-macos-aarch64.tar.gz
          - os: windows-latest
            name: zyphor-windows-x86_64
            archive_cmd: Compress-Archive -Path dist/zyphor.exe -DestinationPath zyphor-windows-x86_64.zip
            artifact: zyphor-windows-x86_64.zip

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.0

      - name: Build
        run: zig build -Doptimize=ReleaseFast

      - name: Prepare Artifact (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp zig-out/bin/zyphor dist/
          ${{ matrix.archive_cmd }}

      - name: Prepare Artifact (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir dist
          cp zig-out/bin/zyphor.exe dist/
          ${{ matrix.archive_cmd }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            *.tar.gz
            *.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
          generate_release_notes: true
