name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: zyphor-linux-x86_64
          - os: macos-latest
            name: zyphor-macos-aarch64
          - os: windows-latest
            name: zyphor-windows-x86_64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure macOS Environment & SDK
        if: runner.os == 'macOS'
        run: |
          sudo xcode-select -s /Library/Developer/CommandLineTools || true
          SDK_PATH=$(xcrun --sdk macosx --show-sdk-path 2>/dev/null || echo "/Library/Developer/CommandLineTools/SDKs/MacOSX.sdk")
          echo "SDKROOT=$SDK_PATH" >> $GITHUB_ENV
          echo "DEVELOPER_DIR=/Library/Developer/CommandLineTools" >> $GITHUB_ENV

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Build
        run: zig build -Doptimize=ReleaseFast

      - name: Prepare Artifact (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp zig-out/bin/zyphor dist/
          tar -czvf ${{ matrix.name }}.tar.gz -C dist zyphor

      - name: Prepare Artifact (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir dist
          cp zig-out/bin/zyphor.exe dist/
          Compress-Archive -Path dist/zyphor.exe -DestinationPath ${{ matrix.name }}.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            *.tar.gz
            *.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
          generate_release_notes: true
