name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    name: Build & Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux x86_64
            target_flag: "-Dtarget=x86_64-linux"
            bin_path: "./zig-out/bin/zyphor"
          - os: windows-latest
            name: Windows x86_64
            target_flag: "-Dtarget=x86_64-windows"
            bin_path: "./zig-out/bin/zyphor.exe"
          - os: macos-latest
            name: macOS aarch64
            target_flag: "-Dtarget=aarch64-macos"
            bin_path: "./zig-out/bin/zyphor"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Cache Zig Build Artifacts
        uses: actions/cache@v4
        with:
          path: |
            .zig-cache
            ~/.cache/zig
            C:\Users\runneradmin\AppData\Local\zig
          key: ${{ runner.os }}-zig-${{ hashFiles('build.zig', 'src/**/*.zig') }}
          restore-keys: |
            ${{ runner.os }}-zig-

      - name: Build Debug Binary
        run: zig build ${{ matrix.target_flag }}

      - name: Build Optimized Release Binary
        run: zig build ${{ matrix.target_flag }} -Doptimize=ReleaseFast

      - name: Run Test Suite
        run: zig build test ${{ matrix.target_flag }} --summary all

      - name: Run Doctor (Smoke Test)
        run: ${{ matrix.bin_path }} doctor
