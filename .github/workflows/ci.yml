name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode / macOS SDK
        if: runner.os == 'macOS'
        run: |
          sudo xcode-select -s /Library/Developer/CommandLineTools || true
          SDK_PATH=$(xcrun --show-sdk-path 2>/dev/null || echo "/Library/Developer/CommandLineTools/SDKs/MacOSX.sdk")
          echo "SDKROOT=$SDK_PATH" >> $GITHUB_ENV
          echo "DEVELOPER_DIR=/Library/Developer/CommandLineTools" >> $GITHUB_ENV

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.0

      - name: Run Test Suite
        run: zig build test

      - name: Build Debug Binary
        run: zig build

      - name: Build Optimized Release Binary
        run: zig build -Doptimize=ReleaseFast

      - name: Run Doctor (Smoke Test)
        shell: bash
        run: |
          if [ "${{ runner.os }}" == "Windows" ]; then
            ./zig-out/bin/zyphor.exe doctor
          else
            ./zig-out/bin/zyphor doctor
          fi
